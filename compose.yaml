services:
  ## DEV MODE
  server:
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        - path: ./src
          action: sync
          target: /usr/src/app/src
        - path: ./package.json
          action: rebuild
    environment:
      NODE_ENV: dev
    ports:
      - 5173:5173
  # removed volume as it conflicted with watch
  # volumes:
  # - .:/usr/src/app
  # - /usr/src/app/node_modules

